<!doctype html>
<html lang="zh-CN" data-storage-namespace="homeroom_workbench" data-design-system="quiet-luxury-a" style="--workbench-folio:'烟洲中学 · 教师工作台'">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="教师工作台" />
  <title>教师工作台</title>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/editorial.css" />
  <link rel="stylesheet" href="css/dashboards.css" />
  <link rel="stylesheet" href="css/editable.css" />
  <link rel="stylesheet" href="css/premium-minimal.css" />
  <link rel="stylesheet" href="css/v3-refactor.css" />
  <link rel="stylesheet" href="css/print.css" media="print" />
</head>
<body>
  <div id="lockScreen" class="lock-screen hidden" aria-labelledby="lockTitle">
    <div class="lock-panel">
      <div class="lock-logo">教师工作台</div>
      <h2 id="lockTitle">已锁定</h2>
      <p class="lock-sub" id="lockSub">请输入锁屏密码继续使用</p>
      <input id="lockInput" type="password" placeholder="锁屏密码" autocomplete="off" aria-label="锁屏密码">
      <p id="lockError" class="lock-error" aria-live="polite"></p>
      <button class="button" id="lockConfirm">解锁</button>
    </div>
  </div>

  <div id="subjectPicker" class="subject-picker" aria-labelledby="pickerTitle">
    <div class="picker-panel">
      <div class="picker-brand"><span class="brand-mark">高</span><span>教师工作台</span></div>
      <p class="eyebrow">2026—2027学年第一学期</p>
      <h1 id="pickerTitle">请选择当前所带班级</h1>
      <p class="muted">进入系统后仍可在顶栏随时切换班级。</p>
      <div id="subjectGrid" class="subject-grid"></div>
    </div>
  </div>

  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="topbar-left">
        <button id="lockButton" class="lock-button" aria-label="立即锁定" title="立即锁定（无操作10分钟自动锁定）">🔒 锁定</button>
        <button id="mobileMenu" class="icon-button mobile-only" aria-label="打开菜单">☰</button>
        <label class="subject-switcher"><span class="sr-only">当前班级</span><select id="subjectSelect"></select></label>
        <button id="subjectPickerButton" class="text-button subject-picker-return" aria-label="管理班级">班级管理</button>
        <div class="primary-tabs" role="tablist" aria-label="工作台类型">
          <button class="primary-tab active" data-area="teaching" role="tab" aria-selected="true">班级工作</button>
          <button class="primary-tab" data-area="scores" role="tab" aria-selected="false">成绩管理</button>
        </div>
      </div>
      <div class="topbar-right">
        <button id="undoBtn" class="icon-button top-action" aria-label="撤回上一次操作" title="撤回上一次操作" disabled>↩</button>
        <button id="redoBtn" class="icon-button top-action" aria-label="回溯上一次操作" title="回溯上一次操作" disabled>↪</button>
        <button id="notifyButton" class="notification" aria-label="通知中心">♢<span class="notification-count" style="display:none">0</span></button>
      </div>
    </header>

    <div class="workspace">
      <aside id="sidebar" class="sidebar" aria-label="模块导航"></aside>
      <main id="mainContent" class="main-content" tabindex="-1"></main>
      <aside id="drawer" class="detail-drawer hidden" aria-label="详情面板"></aside>
    </div>
    <footer class="statusbar"><span id="syncStatus">数据已同步：刚刚</span><span id="todoStatus">待办3项</span><span>当前身份：<strong id="identityStatus">高一(1)班班主任</strong></span></footer>
  </div>

  <div id="modalRoot"></div>
  <div id="cursorHalo" aria-hidden="true"></div>
  <script src="js/hero-media.js"></script>
  <script src="js/local-persistence.js"></script>
  <script src="js/remote-store.js"></script>
  <script src="js/core.js"></script>
  <script src="js/data.js"></script>
  <script src="js/editable-workbench.js"></script>
  <script src="js/dashboards.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
